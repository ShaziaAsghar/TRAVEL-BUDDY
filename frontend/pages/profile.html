<main class="page-shell"><div class="page-heading"><p class="eyebrow">TRAVEL BUDDY</p><h1>Travel profile</h1><p>Tell us how you like to travel.</p></div>

<label>Usual budget (PKR)<input type="number" name="budget" min="0" value="25000"></label>
