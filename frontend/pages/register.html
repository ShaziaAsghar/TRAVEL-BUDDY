<main class="page-shell"><div class="page-heading"><p class="eyebrow">TRAVEL BUDDY</p><h1>Create your account</h1><p>Save your preferences and travel plans.</p></div>
<form id="register-form" class="form-card">
<label>Full name<input name="name" required placeholder="Your name"></label>
<label>Email<input type="email" name="email" required placeholder="you@example.com"></label>
<label>Password<input type="password" name="password" minlength="8" required placeholder="At least 8 characters"></label>
<button class="btn" type="submit">Create account</button><p id="form-message" class="message"></p>
<p>Already registered? <a href="login.html">Login</a></p></form></main>
